{% extends "accounts/layout.html" %}
{% block accounts_content %}
<form method="post" class="acc-form" novalidate>
  {% csrf_token %}
  {% for field in form %}
  {% include "accounts/includes/field.html" with field=field %}
  {% endfor %}
  <button type="submit" class="acc-btn">Sign Up</button>
</form>
<p class="acc-switch">Already have an account? <a href="{% url 'accounts:login' %}" class="acc-link">Sign in</a></p>
{% endblock %}
