upstream siresoft_rag {
    server web:8000;
}

server {
    listen 80;
    client_max_body_size 110M;

    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
    }

    location /media/ {
        alias /app/media/;
    }

    # Streaming chat endpoint: buffering must be off, or nginx waits for
    # the whole SSE response to finish before forwarding anything to the
    # browser -- the user would see nothing, then the whole answer appear
    # at once, defeating the point of streaming.
    location ~ ^/api/chat/sessions/\d+/messages/$ {
        proxy_pass http://siresoft_rag;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        proxy_read_timeout 300s;
    }

    location / {
        proxy_pass http://siresoft_rag;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
