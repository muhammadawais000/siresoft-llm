# `upstream` blocks resolve their `server` hostname once, at nginx startup,
# and never again -- so when `web` is recreated by a rebuild/redeploy and
# gets a new container IP on the compose network, nginx keeps sending
# traffic to the old (now-dead) IP until nginx itself is restarted, which
# shows up as 502s with "connect() failed" in the error log. Docker's
# embedded DNS (127.0.0.11) plus a variable in proxy_pass forces nginx to
# re-resolve `web` on this `valid` interval instead of caching it forever,
# so a `web` redeploy alone (no nginx restart needed) stays healthy.
resolver 127.0.0.11 valid=10s;

server {
    listen 80;
    client_max_body_size 110M;

    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
    }

    location /media/ {
        alias /app/media/;
    }

    # Streaming chat endpoint: buffering must be off, or nginx waits for
    # the whole SSE response to finish before forwarding anything to the
    # browser -- the user would see nothing, then the whole answer appear
    # at once, defeating the point of streaming.
    location ~ ^/api/chat/sessions/\d+/messages/$ {
        set $upstream_web http://web:8000;
        proxy_pass $upstream_web;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        proxy_read_timeout 300s;
    }

    location / {
        set $upstream_web http://web:8000;
        proxy_pass $upstream_web;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
