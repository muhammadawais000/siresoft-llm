# Minimal SearXNG config for this project's internal use only -- no public
# port is exposed (see docker-compose.yml), only the web/worker containers
# on the compose network can reach it. `formats: json` is the one setting
# that matters here: SearXNG serves HTML-only by default, and rag/web_search.py
# needs the JSON API.
use_default_settings: true

general:
  instance_name: "siresoft-searxng"

search:
  formats:
    - html
    - json

server:
  secret_key: "e54cf2161ee5c2be36071f58d0e05ac9e4278ce48862937391f906706134261b"
  limiter: false
  image_proxy: false

# Self-hosted meta-search's real weak spot: engines that need a browser-like
# scrape (Google especially) get IP-blocked easily from a plain server, so
# the merged results can skew toward whatever weaker engine still responds
# -- forum/blog posts outranking an authoritative source for a plain
# definitional query like "what is python". Boosting Wikipedia (has a real
# API, never blocks) and the other scrape-resistant engines pulls
# definitional answers back toward the top without disabling anything.
engines:
  - name: wikipedia
    weight: 6
  - name: duckduckgo
    weight: 2
  - name: brave
    weight: 2
